<mat-button-toggle-group class="language-switcher" [value]="currentLanguage()" (change)="useLanguage($event.value)" hideSingleSelectionIndicator [attr.aria-label]="'language-switcher.label' | translate">
  @for (language of languages; track language) {
    <mat-button-toggle [value]="language">{{ language | uppercase }}</mat-button-toggle>
  }
</mat-button-toggle-group>
